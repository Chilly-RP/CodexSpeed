name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run core tests
        run: swift run CodexSpeedCoreTests

      - name: Build release binary
        run: swift build -c release --product CodexSpeed
